<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="40%" stop-color="#0B1020"/>
      <stop offset="70%" stop-color="#0D1326"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>

    <!-- Glowing Radial Accents -->
    <radialGradient id="center-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="left-glow" cx="15%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="right-glow" cx="85%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Animated Name Shimmer Gradient -->
    <linearGradient id="name-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF">
        <animate attributeName="stop-color" values="#FFFFFF;#00D9FF;#FFFFFF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="35%" stop-color="#F2F6FF"/>
      <stop offset="65%" stop-color="#9E86FF">
        <animate attributeName="stop-color" values="#9E86FF;#39E6A5;#9E86FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00D9FF">
        <animate attributeName="stop-color" values="#00D9FF;#7C5CFF;#00D9FF" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Scanner Line Gradient -->
    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Accent Beam Gradient -->
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#7C5CFF"/>
      <stop offset="50%" stop-color="#00D9FF"/>
      <stop offset="80%" stop-color="#39E6A5"/>
      <stop offset="100%" stop-color="#39E6A5" stop-opacity="0"/>
    </linearGradient>

    <!-- Synapse Gradient 1 -->
    <linearGradient id="syn-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Synapse Gradient 2 -->
    <linearGradient id="syn-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#39E6A5" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Cyberpunk Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2A3F" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="40" cy="0" r="0.9" fill="#00D9FF" fill-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="480" fill="url(#bg-grad)" rx="16"/>
  <rect width="1200" height="480" fill="url(#cyber-grid)" rx="16"/>
  <rect width="1200" height="480" fill="url(#center-glow)" rx="16"/>
  <rect width="1200" height="480" fill="url(#left-glow)" rx="16"/>
  <rect width="1200" height="480" fill="url(#right-glow)" rx="16"/>

  <!-- Outer Tech Border Frame -->
  <rect x="14" y="14" width="1172" height="452" rx="12" fill="none" stroke="#25324B" stroke-width="1.2" stroke-opacity="0.85"/>
  
  <!-- Glowing Animated Scanner Line sweeping vertically -->
  <line x1="20" y1="0" x2="1180" y2="0" stroke="url(#scan-grad)" stroke-width="1.8" stroke-opacity="0.5">
    <animate attributeName="y1" values="20;460;20" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="20;460;20" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.2;0.7;0.2" dur="7s" repeatCount="indefinite"/>
  </line>

  <!-- Corner Brackets -->
  <path d="M 14 46 L 14 14 L 46 14" fill="none" stroke="#7C5CFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M 1186 46 L 1186 14 L 1154 14" fill="none" stroke="#00D9FF" stroke-width="3" stroke-linecap="round"/>
  <path d="M 14 434 L 14 466 L 46 466" fill="none" stroke="#00D9FF" stroke-width="3" stroke-linecap="round"/>
  <path d="M 1186 434 L 1186 466 L 1154 466" fill="none" stroke="#39E6A5" stroke-width="3" stroke-linecap="round"/>

  <!-- ============================================================== -->
  <!-- TOP TELEMETRY STRIP (HIGH-TECH LAB HEADER)                     -->
  <!-- ============================================================== -->
  <g transform="translate(40, 36)">
    <!-- Status Indicator -->
    <rect x="0" y="0" width="138" height="26" rx="13" fill="#0D1322" stroke="#25324B" stroke-width="1"/>
    <circle cx="16" cy="13" r="4.5" fill="#39E6A5">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4.5;5.5;4.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="29" y="17" fill="#39E6A5" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2">SYSTEM ACTIVE</text>

    <!-- Lab & University Tag -->
    <text x="156" y="17" fill="#7C5CFF" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8">AI_RESEARCH_CORE // V5.0</text>
    <text x="362" y="17" fill="#374765" font-family="'Segoe UI', sans-serif" font-size="12">|</text>
    <text x="380" y="17" fill="#A7B1C5" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2">SANJIVANI UNIVERSITY</text>

    <!-- Right Side Telemetry Metrics -->
    <text x="890" y="17" fill="#A7B1C5" font-family="'Courier New', monospace" font-size="11" letter-spacing="1.2">LOSS: 0.0018</text>
    <text x="1000" y="17" fill="#00D9FF" font-family="'Courier New', monospace" font-size="11" letter-spacing="1.2">CYCLE: 2026.Q4</text>
  </g>

  <line x1="40" y1="74" x2="1160" y2="74" stroke="url(#beam-grad)" stroke-width="1.2"/>

  <!-- ============================================================== -->
  <!-- LEFT FLANK: NEURAL DATA MATRIX & SYNAPSE PATHWAYS              -->
  <!-- ============================================================== -->
  <g id="left-neural-flank" transform="translate(45, 90)">
    <!-- Circuit Synaptic Connections -->
    <path d="M 30 110 Q 110 50 180 140 T 260 90" fill="none" stroke="url(#syn-left)" stroke-width="1.6" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" values="40;0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 30 200 Q 120 240 190 160 T 270 230" fill="none" stroke="#7C5CFF" stroke-opacity="0.4" stroke-width="1.4"/>
    <path d="M 30 280 Q 100 210 180 270 T 260 210" fill="none" stroke="#00D9FF" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="0;40" dur="4s" repeatCount="indefinite"/>
    </path>
    <line x1="30" y1="110" x2="100" y2="200" stroke="#25324B" stroke-width="1"/>
    <line x1="100" y1="200" x2="180" y2="140" stroke="#25324B" stroke-width="1"/>
    <line x1="180" y1="140" x2="260" y2="90" stroke="#25324B" stroke-width="1"/>

    <!-- Nodes with Pulse Animations -->
    <!-- Node 1 -->
    <circle cx="30" cy="110" r="7" fill="#0B1020" stroke="#00D9FF" stroke-width="2.2"/>
    <circle cx="30" cy="110" r="3" fill="#00D9FF">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Node 2 -->
    <circle cx="30" cy="200" r="5" fill="#0B1020" stroke="#7C5CFF" stroke-width="1.8"/>
    <circle cx="30" cy="200" r="2" fill="#7C5CFF"/>

    <!-- Node 3 -->
    <circle cx="30" cy="280" r="6" fill="#0B1020" stroke="#39E6A5" stroke-width="2"/>
    <circle cx="30" cy="280" r="2.5" fill="#39E6A5"/>

    <!-- Layer 2 Nodes -->
    <circle cx="100" cy="200" r="8" fill="#0B1020" stroke="#00D9FF" stroke-width="2.5"/>
    <circle cx="100" cy="200" r="3.5" fill="#00D9FF">
      <animate attributeName="r" values="3.5;5;3.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Layer 3 Nodes -->
    <circle cx="180" cy="140" r="9" fill="#0B1020" stroke="#7C5CFF" stroke-width="2.5"/>
    <circle cx="180" cy="140" r="4" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="190" cy="260" r="5" fill="#0B1020" stroke="#39E6A5" stroke-width="1.8"/>

    <!-- Layer 4 Connector Nodes -->
    <circle cx="260" cy="90" r="6" fill="#0B1020" stroke="#00D9FF" stroke-width="2"/>
    <circle cx="260" cy="90" r="2.5" fill="#00D9FF"/>
    <circle cx="270" cy="230" r="7" fill="#0B1020" stroke="#7C5CFF" stroke-width="2"/>

    <!-- Mathematical Annotations (Left) -->
    <g font-family="'Courier New', monospace" font-size="10" fill="#7182A2" opacity="0.75">
      <text x="15" y="65">f(x) = σ(Wᵀx + b)</text>
      <text x="120" y="80">dim:[B, S, D]</text>
      <text x="60" y="315">∇_θ L(y, ŷ) ↦ 0</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- RIGHT FLANK: ATTENTION MECHANISM & TENSOR TOPOLOGY             -->
  <!-- ============================================================== -->
  <g id="right-neural-flank" transform="translate(890, 90)">
    <!-- Circuit Synaptic Connections -->
    <path d="M 10 90 Q 90 140 160 60 T 240 120" fill="none" stroke="url(#syn-right)" stroke-width="1.6" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" values="0;40" dur="3.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 10 220 Q 90 160 170 230 T 240 190" fill="none" stroke="#00D9FF" stroke-opacity="0.4" stroke-width="1.4"/>
    <path d="M 20 160 Q 100 240 180 180 T 250 270" fill="none" stroke="#39E6A5" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="10" y1="90" x2="90" y2="160" stroke="#25324B" stroke-width="1"/>
    <line x1="90" y1="160" x2="160" y2="60" stroke="#25324B" stroke-width="1"/>
    <line x1="170" y1="230" x2="240" y2="190" stroke="#25324B" stroke-width="1"/>

    <!-- Nodes with Pulse Animations -->
    <circle cx="10" cy="90" r="6" fill="#0B1020" stroke="#7C5CFF" stroke-width="2"/>
    <circle cx="10" cy="90" r="2.5" fill="#7C5CFF"/>

    <circle cx="10" cy="220" r="7" fill="#0B1020" stroke="#00D9FF" stroke-width="2.2"/>
    <circle cx="10" cy="220" r="3" fill="#00D9FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Center Latent Nodes -->
    <circle cx="90" cy="160" r="9" fill="#0B1020" stroke="#39E6A5" stroke-width="2.5"/>
    <circle cx="90" cy="160" r="4" fill="#39E6A5">
      <animate attributeName="r" values="4;5.5;4" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Attention Head Sink -->
    <circle cx="160" cy="60" r="8" fill="#0B1020" stroke="#7C5CFF" stroke-width="2.5"/>
    <circle cx="160" cy="60" r="3.5" fill="#FFFFFF"/>

    <circle cx="170" cy="230" r="6" fill="#0B1020" stroke="#00D9FF" stroke-width="2"/>
    
    <!-- Output Nodes -->
    <circle cx="240" cy="120" r="8" fill="#0B1020" stroke="#39E6A5" stroke-width="2.5"/>
    <circle cx="240" cy="120" r="3.5" fill="#39E6A5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.9s" repeatCount="indefinite"/>
    </circle>

    <circle cx="250" cy="270" r="5" fill="#0B1020" stroke="#7C5CFF" stroke-width="1.8"/>

    <!-- Mathematical Annotations (Right) -->
    <g font-family="'Courier New', monospace" font-size="10" fill="#7182A2" opacity="0.75">
      <text x="30" y="45">Softmax(QKᵀ / √d)</text>
      <text x="130" y="270">z = W · x + b</text>
      <text x="40" y="315">acc: 99.4%</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- CENTERPIECE: MASSIVE CENTERED NAME & COMPREHENSIVE BIO         -->
  <!-- ============================================================== -->
  <g transform="translate(600, 115)">
    <!-- Sub-badge / Target Focus -->
    <g transform="translate(0, 0)">
      <rect x="-110" y="0" width="220" height="24" rx="12" fill="#0D1322" stroke="#25324B" stroke-width="1"/>
      <circle cx="-94" cy="12" r="3.5" fill="#00D9FF">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="6" y="16" text-anchor="middle" fill="#00D9FF" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="2">PORTFOLIO_CORE // ACTIVE</text>
    </g>

    <!-- HUGE CENTERED NAME: OM KHAIRE -->
    <text x="0" y="92" text-anchor="middle" fill="url(#name-gradient)" font-family="'Segoe UI', -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="82" font-weight="900" letter-spacing="8">
      OM KHAIRE
    </text>

    <!-- High-Impact Glowing Accent Underline -->
    <line x1="-280" y1="116" x2="280" y2="116" stroke="url(#beam-grad)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Central Pulsing Core on the line -->
    <circle cx="0" cy="116" r="4.5" fill="#FFFFFF">
      <animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="116" r="9" fill="none" stroke="#00D9FF" stroke-width="1.2">
      <animate attributeName="r" values="7;13;7" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Primary Subtitle (Centered) -->
    <text x="0" y="152" text-anchor="middle" fill="#F4F7FF" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="19" font-weight="800" letter-spacing="2">
      B.TECH IN ARTIFICIAL INTELLIGENCE &amp; MACHINE LEARNING
    </text>

    <!-- Academic & Role Identity Strip (Centered) -->
    <g transform="translate(0, 180)">
      <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', -apple-system, Roboto, sans-serif">
        <tspan fill="#7C5CFF" font-weight="700" font-size="15" letter-spacing="1.2">SANJIVANI UNIVERSITY</tspan>
        <tspan fill="#374765" font-size="16">  •  </tspan>
        <tspan fill="#00D9FF" font-weight="600" font-size="14.5" letter-spacing="0.8">Aspiring AI/ML Engineer</tspan>
        <tspan fill="#374765" font-size="16">  •  </tspan>
        <tspan fill="#39E6A5" font-weight="600" font-size="14.5" letter-spacing="0.8">Intelligent Systems Builder</tspan>
      </text>
    </g>

    <!-- Tagline (Centered) -->
    <text x="0" y="218" text-anchor="middle" fill="#9BA8C2" font-family="'Georgia', serif" font-style="italic" font-size="14.5" letter-spacing="0.5">
      "Building intelligent systems. Exploring machine learning. Turning data into insight."
    </text>

    <!-- Centered Strategic Focus Badges / Chips -->
    <g transform="translate(0, 248)">
      <!-- Chip 1: Machine Learning -->
      <g transform="translate(-255, 0)">
        <rect x="0" y="0" width="120" height="28" rx="6" fill="#0D1322" stroke="#7C5CFF" stroke-width="1.2"/>
        <circle cx="12" cy="14" r="3.5" fill="#7C5CFF"/>
        <text x="22" y="18" fill="#F4F7FF" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">ML Systems</text>
      </g>

      <!-- Chip 2: Deep Learning -->
      <g transform="translate(-125, 0)">
        <rect x="0" y="0" width="120" height="28" rx="6" fill="#0D1322" stroke="#00D9FF" stroke-width="1.2"/>
        <circle cx="12" cy="14" r="3.5" fill="#00D9FF"/>
        <text x="22" y="18" fill="#F4F7FF" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Deep Learning</text>
      </g>

      <!-- Chip 3: Neural Networks -->
      <g transform="translate(5, 0)">
        <rect x="0" y="0" width="126" height="28" rx="6" fill="#0D1322" stroke="#39E6A5" stroke-width="1.2"/>
        <circle cx="12" cy="14" r="3.5" fill="#39E6A5"/>
        <text x="22" y="18" fill="#F4F7FF" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Neural Networks</text>
      </g>

      <!-- Chip 4: Data Engineering -->
      <g transform="translate(141, 0)">
        <rect x="0" y="0" width="114" height="28" rx="6" fill="#0D1322" stroke="#25324B" stroke-width="1.2"/>
        <circle cx="12" cy="14" r="3.5" fill="#A7B1C5"/>
        <text x="22" y="18" fill="#A7B1C5" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Data Science</text>
      </g>
    </g>
  </g>

  <!-- Bottom Visual Accent Border -->
  <line x1="40" y1="448" x2="1160" y2="448" stroke="#1F2A3F" stroke-width="1" stroke-opacity="0.6"/>
  <rect x="480" y="446" width="240" height="4" rx="2" fill="url(#beam-grad)"/>
</svg>
