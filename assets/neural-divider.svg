<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 32" width="100%" height="32">
  <defs>
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset="25%" stop-color="#7C5CFF" stop-opacity="0.4"/>
      <stop offset="48%" stop-color="#00D9FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="52%" stop-color="#00D9FF" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#39E6A5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#39E6A5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Main glowing line -->
  <line x1="20" y1="16" x2="980" y2="16" stroke="url(#div-grad)" stroke-width="1.5"/>

  <!-- Left Accent Nodes -->
  <circle cx="280" cy="16" r="2" fill="#7C5CFF" opacity="0.6"/>
  <circle cx="360" cy="16" r="2.5" fill="#7C5CFF" opacity="0.8"/>

  <!-- Center Active Neural Core -->
  <circle cx="500" cy="16" r="10" fill="url(#node-glow)"/>
  <circle cx="500" cy="16" r="4" fill="#080B12" stroke="#00D9FF" stroke-width="1.5"/>
  <circle cx="500" cy="16" r="1.8" fill="#FFFFFF"/>
  <rect x="480" y="14" width="4" height="4" fill="#7C5CFF" opacity="0.7"/>
  <rect x="516" y="14" width="4" height="4" fill="#39E6A5" opacity="0.7"/>

  <!-- Right Accent Nodes -->
  <circle cx="640" cy="16" r="2.5" fill="#39E6A5" opacity="0.8"/>
  <circle cx="720" cy="16" r="2" fill="#39E6A5" opacity="0.6"/>
</svg>
